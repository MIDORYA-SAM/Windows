
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17191e">
<title>Windows SSD Explorer 0.1</title>

<style>
:root {
  --bg:#f3f5f9;
  --panel:#ffffff;
  --panel2:#e9edf4;
  --text:#20232a;
  --muted:#737b89;
  --border:#dce1e9;
  --accent:#3478df;
  --hover:#e8f0fc;
  --shadow:0 5px 25px #00000012;
}

body.dark {
  --bg:#17191e;
  --panel:#22252c;
  --panel2:#2c3039;
  --text:#f0f2f6;
  --muted:#a1a8b5;
  --border:#383d48;
  --accent:#5597ff;
  --hover:#303d51;
  --shadow:0 5px 25px #00000035;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Segoe UI,Arial,sans-serif;
  height:100dvh;
  overflow:hidden;
}

button,input {
  font:inherit;
}

button {
  cursor:pointer;
  color:inherit;
}

.app {
  height:100dvh;
  display:flex;
  flex-direction:column;
}

/* HEADER */

.header {
  height:58px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
}

.brand {
  display:flex;
  align-items:center;
  gap:10px;
  font-size:17px;
  font-weight:700;
}

.logo {
  background:#3478df;
  color:white;
  padding:8px;
  border-radius:9px;
  font-size:19px;
}

.version {
  font-size:10px;
  color:var(--muted);
  font-weight:400;
}

.header-actions {
  display:flex;
  gap:8px;
}

.icon-btn {
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:9px;
  padding:9px 12px;
}

/* TOOLBAR */

.toolbar {
  display:flex;
  align-items:center;
  gap:8px;
  padding:12px 15px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
}

.action {
  border:1px solid var(--border);
  background:var(--panel);
  padding:9px 13px;
  border-radius:8px;
  font-size:13px;
  white-space:nowrap;
}

.action:hover,.icon-btn:hover {
  background:var(--hover);
}

.primary {
  background:var(--accent);
  color:white;
  border-color:var(--accent);
}

.primary:hover {
  opacity:.85;
  background:var(--accent);
}

.search {
  flex:1;
  min-width:60px;
  padding:10px 13px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  outline:none;
}

.search:focus {
  border-color:var(--accent);
}

/* MAIN */

.main {
  flex:1;
  min-height:0;
  display:flex;
}

.sidebar {
  width:220px;
  flex-shrink:0;
  padding:15px 10px;
  background:var(--panel);
  border-right:1px solid var(--border);
  overflow:auto;
}

.side-title {
  font-size:11px;
  font-weight:700;
  color:var(--muted);
  padding:10px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.side-item {
  display:flex;
  gap:11px;
  align-items:center;
  width:100%;
  border:0;
  background:transparent;
  color:var(--text);
  padding:11px;
  border-radius:8px;
  text-align:left;
  font-size:13px;
  margin-bottom:3px;
}

.side-item:hover,.side-item.active {
  background:var(--hover);
}

.side-icon {
  font-size:18px;
}

.content {
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.pathbar {
  display:flex;
  align-items:center;
  gap:7px;
  padding:13px 17px;
  border-bottom:1px solid var(--border);
  background:var(--panel);
  overflow-x:auto;
  white-space:nowrap;
  font-size:13px;
}

.path-button {
  border:0;
  background:transparent;
  color:var(--text);
  padding:5px;
  border-radius:5px;
}

.path-button:hover {
  background:var(--hover);
}

.path-separator {
  color:var(--muted);
}

/* FILE AREA */

.file-heading {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 20px;
}

.file-heading h2 {
  margin:0;
  font-size:19px;
}

.file-count {
  color:var(--muted);
  font-size:12px;
}

.file-area {
  flex:1;
  overflow:auto;
  padding:5px 18px 25px;
}

.files {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
  gap:10px;
}

.file {
  border:1px solid transparent;
  border-radius:10px;
  min-width:0;
  padding:13px 7px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:9px;
  cursor:pointer;
  text-align:center;
}

.file:hover {
  background:var(--hover);
}

.file.selected {
  background:var(--hover);
  border-color:var(--accent);
}

.file-icon {
  font-size:39px;
  line-height:1.3;
}

.file-name {
  font-size:12px;
  width:100%;
  overflow-wrap:anywhere;
  line-height:1.4;
}

.file-size {
  font-size:10px;
  color:var(--muted);
}

.empty {
  text-align:center;
  padding:65px 15px;
  color:var(--muted);
}

.empty-icon {
  font-size:55px;
  margin-bottom:15px;
}

/* STATUS */

.statusbar {
  min-height:33px;
  flex-shrink:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:5px 15px;
  font-size:11px;
  color:var(--muted);
  background:var(--panel);
  border-top:1px solid var(--border);
}

/* PREVIEW */

.overlay {
  position:fixed;
  inset:0;
  background:#000a;
  z-index:10;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.overlay.show {
  display:flex;
}

.modal {
  width:min(700px,100%);
  max-height:90dvh;
  overflow:auto;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:var(--shadow);
}

.modal-header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  border-bottom:1px solid var(--border);
}

.modal-body {
  padding:18px;
  text-align:center;
}

.modal-body img {
  max-width:100%;
  max-height:60dvh;
  object-fit:contain;
}

.modal-body iframe {
  width:100%;
  height:60dvh;
  border:0;
}

.modal-body pre {
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  text-align:left;
  max-height:55dvh;
  overflow:auto;
  background:var(--bg);
  padding:14px;
  border-radius:8px;
  font-size:12px;
}

.modal-footer {
  display:flex;
  justify-content:flex-end;
  gap:8px;
  padding:12px;
  border-top:1px solid var(--border);
}

.hidden { display:none!important; }

/* MOBILE */

@media(max-width:650px) {
  .sidebar {
    width:65px;
    padding:12px 5px;
  }

  .side-title,.side-label {
    display:none;
  }

  .side-item {
    justify-content:center;
    padding:13px 5px;
  }

  .side-icon {
    font-size:21px;
  }

  .toolbar {
    flex-wrap:wrap;
    padding:9px;
  }

  .toolbar .action {
    padding:9px;
    font-size:11px;
  }

  .search {
    order:5;
    flex-basis:100%;
  }

  .file-heading {
    padding:13px;
  }

  .file-area {
    padding:5px 8px 20px;
  }

  .files {
    grid-template-columns:repeat(auto-fill,minmax(85px,1fr));
    gap:4px;
  }

  .file {
    padding:10px 4px;
  }

  .brand {
    font-size:14px;
  }
}
</style>
</head>

<body class="dark">

<div class="app">

  <header class="header">
    <div class="brand">
      <div class="logo">▦</div>
      <div>
        Windows SSD Explorer
        <div class="version">VERSÃO 0.1</div>
      </div>
    </div>

    <div class="header-actions">
      <button class="icon-btn" id="themeBtn" title="Alternar tema">
        ☀️
      </button>
      <button class="icon-btn" id="aboutBtn" title="Sobre">
        ℹ️
      </button>
    </div>
  </header>

  <div class="toolbar">
    <button class="action primary" id="connectBtn">
      🔌 Conectar SSD
    </button>

    <button class="action" id="homeBtn">⌂ Início</button>

    <button class="action" id="backBtn">← Voltar</button>

    <input
      class="search"
      id="search"
      type="search"
      placeholder="Pesquisar arquivos e pastas..."
    >

    <button class="action" id="viewBtn">▤ Lista</button>
  </div>

  <main class="main">

    <aside class="sidebar">

      <div class="side-title">Navegação</div>

      <button class="side-item active" id="navHome">
        <span class="side-icon">⌂</span>
        <span class="side-label">Início</span>
      </button>

      <button class="side-item" id="navDesktop">
        <span class="side-icon">🖥️</span>
        <span class="side-label">Área de trabalho</span>
      </button>

      <button class="side-item" id="navDocuments">
        <span class="side-icon">📄</span>
        <span class="side-label">Documentos</span>
      </button>

      <button class="side-item" id="navDownloads">
        <span class="side-icon">⬇️</span>
        <span class="side-label">Downloads</span>
      </button>

      <button class="side-item" id="navPictures">
        <span class="side-icon">🖼️</span>
        <span class="side-label">Imagens</span>
      </button>

      <div class="side-title">Dispositivos</div>

      <button class="side-item" id="navSSD">
        <span class="side-icon">💽</span>
        <span class="side-label">SSD / Windows</span>
      </button>

    </aside>

    <section class="content">

      <div class="pathbar" id="pathbar">
        <span>⌂</span>
        <span>Início</span>
      </div>

      <div class="file-heading">
        <h2 id="folderTitle">Início</h2>
        <span class="file-count" id="fileCount">0 itens</span>
      </div>

        <div class="files" id="files"></div>
        <div class="empty hidden" id="empty">
          <div class="empty-icon">💽</div>

          <p id="emptyDescription">
            Conecte seu SSD ou selecione uma pasta.
          </p>
          <button class="action primary" onclick="connectSSD()">

          </button>

      </div>

    </section>

  </main>

  <footer class="statusbar">
    <span id="status">Aguardando conexão</span>
    <span>Windows SSD Explorer 0.1</span>
  </footer>

</div>

<!-- SELETORES -->

<input type="file" id="folderInput"
  webkitdirectory directory multiple class="hidden">

<input type="file" id="fileInput" multiple class="hidden">

<!-- VISUALIZADOR -->

<div class="overlay" id="overlay">
  <div class="modal">

    <div class="modal-header">
      <strong id="previewTitle">Arquivo</strong>
      <button class="icon-btn" id="closePreview">✕</button>
    </div>

    <div class="modal-body" id="previewBody"></div>

    <div class="modal-footer">
      <button class="action" id="downloadBtn">
        ⬇ Copiar para o celular
      </button>
      <button class="action" id="closePreview2">
        Fechar
      </button>
    </div>

  </div>
</div>

<script>
const $ = id => document.getElementById(id);

let root = null;
let current = null;
let history = [];
let selected = null;
let listMode = false;
let searchText = "";
let currentPreviewURL = null;

/* ÁRVORE DE ARQUIVOS */

function directory(name, handle=null, parent=null) {
  return {
    name,
    type:"directory",
    handle,
    parent,
    children:[],
    loaded:!handle,
    path:parent ? [...parent.path,name] : [name]
  };
}

function fileNode(file,parent) {
  return {
    name:file.name,
    type:"file",
    file,
    parent,
    path:[...parent.path,file.name]
  };
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}

/* CARREGAR PASTAS USB */

async function loadDirectory(node) {
  if(node.loaded) return;

  try {
    const children=[];

    for await (const [name,handle] of node.handle.entries()) {
      if(handle.kind==="directory") {
        children.push(directory(name,handle,node));
      } else {
        const file=await handle.getFile();
        children.push(fileNode(file,node));
      }
    }

    node.children=children;
    node.loaded=true;

    node.children.sort((a,b)=>{
      if(a.type!==b.type) return a.type==="directory"?-1:1;
      return a.name.localeCompare(b.name);
    });

  } catch(error) {
    console.error(error);
    alert("Não foi possível ler esta pasta. Verifique as permissões.");
  }
}

/* CONECTAR SSD */

async function connectSSD() {

  // Tentativa com API de pastas do navegador.
  if(window.showDirectoryPicker) {
    try {
      const handle=await window.showDirectoryPicker({
        mode:"read"
      });

      root=directory(handle.name,handle);
      current=root;

      $("status").textContent="Armazenamento conectado: "+handle.name;

      await loadDirectory(root);
      history=[];
      render();
      return;

    } catch(error) {
      if(error.name==="AbortError") return;
      console.log("API de diretórios indisponível:",error);
    }
  }

  // Alternativa: selecionar pasta pelo sistema.
  if("webkitdirectory" in $("folderInput")) {
    $("folderInput").click();
  } else {
    $("fileInput").click();
  }
}

/* IMPORTAR PASTA */

$("folderInput").addEventListener("change",e=>{
  const files=Array.from(e.target.files);

  if(!files.length) return;

  root=directory(
    files[0].webkitRelativePath.split("/")[0] || "SSD"
  );

  for(const file of files) {
    const parts=file.webkitRelativePath
      ? file.webkitRelativePath.split("/")
      : [file.name];

    let node=root;

    for(let i=1;i<parts.length-1;i++) {
      let child=node.children.find(
        x=>x.type==="directory" && x.name===parts[i]
      );

      if(!child) {
        child=directory(parts[i],null,node);
        node.children.push(child);
      }

      node=child;
    }

    node.children.push(fileNode(file,node));
  }

  current=root;
  history=[];
  $("status").textContent=files.length+" arquivos carregados";
  e.target.value="";
  render();
});

/* IMPORTAR ARQUIVOS */

$("fileInput").addEventListener("change",e=>{
  const files=Array.from(e.target.files);

  if(!files.length) return;

  root=directory("Arquivos selecionados");

  root.children=files.map(file=>fileNode(file,root));

  current=root;
  history=[];
  $("status").textContent=files.length+" arquivos selecionados";

  e.target.value="";
  render();
});

/* NAVEGAÇÃO */

async function navigate(node) {
  if(!node || node.type!=="directory") return;

  if(current && current!==node) history.push(current);

  await loadDirectory(node);

  current=node;
  selected=null;
  render();
}

function goBack() {
  if(history.length) {
    current=history.pop();
    selected=null;
    render();
  } else if(current && current.parent) {
    current=current.parent;
    render();
  }
}

/* PESQUISA */

function collectFiles(node,results=[]) {
  if(!node || !node.children) return results;

  for(const child of node.children) {
    results.push(child);
    if(child.type==="directory") collectFiles(child,results);
  }

  return results;
}

/* ÍCONES */

function getIcon(node) {
  if(node.type==="directory") return "📁";

  const ext=node.name.split(".").pop().toLowerCase();

  const icons={
    pdf:"📕",
    jpg:"🖼️",jpeg:"🖼️",png:"🖼️",gif:"🖼️",
    webp:"🖼️",bmp:"🖼️",
    mp4:"🎬",mkv:"🎬",mov:"🎬",
    mp3:"🎵",wav:"🎵",
    txt:"📄",doc:"📝",docx:"📝",
    xls:"📊",xlsx:"📊",
    zip:"📦",rar:"📦",7z:"📦",
    exe:"⚙️",dll:"⚙️",sys:"⚙️",
    html:"🌐",js:"📜",css:"🎨",
    iso:"💿"
  };

  return icons[ext] || "📄";
}

/* TAMANHO */

function formatSize(size) {
  if(size===undefined) return "";

  if(size<1024) return size+" B";
  if(size<1048576) return (size/1024).toFixed(1)+" KB";
  if(size<1073741824) return (size/1048576).toFixed(1)+" MB";

  return (size/1073741824).toFixed(2)+" GB";
}

/* INTERFACE */

function render() {
  if(!current) return;

  $("folderTitle").textContent=current.name;

  const query=searchText.trim().toLowerCase();

  let items=current.children || [];

  if(query) {
    items=collectFiles(root,[]).filter(
      item=>item.name.toLowerCase().includes(query)
    );
  }

  $("fileCount").textContent=items.length+
    (items.length===1?" item":" itens");

  $("empty").classList.toggle("hidden",items.length>0);
  $("files").classList.toggle("hidden",items.length===0);

  $("emptyTitle").textContent=query
    ?"Nenhum resultado encontrado"
    :"Esta pasta está vazia";

  $("emptyDescription").textContent=query
    ?"Tente pesquisar outro nome."
    :"Selecione uma pasta ou conecte um armazenamento.";

  $("files").style.gridTemplateColumns=listMode
    ?"1fr"
    :"";

  $("files").innerHTML=items.map((item,index)=>`
    <div class="file ${selected===item?"selected":""}"
      data-index="${index}">
      <div class="file-icon">${getIcon(item)}</div>
      <div class="file-name">${escapeHTML(item.name)}</div>
      <div class="file-size">
        ${item.type==="directory"?"Pasta":formatSize(item.file?.size)}
      </div>
    </div>
  `).join("");

  $("pathbar").innerHTML="";

  let ancestors=[];
  let node=current;

  while(node) {
    ancestors.unshift(node);
    node=node.parent;
  }

  ancestors.forEach((item,index)=>{
    if(index) {
      const sep=document.createElement("span");
      sep.className="path-separator";
      sep.textContent="›";
      $("pathbar").appendChild(sep);
    }

    const button=document.createElement("button");
    button.className="path-button";
    button.textContent=item.name;

    button.addEventListener("click",()=>{
      history=[];
      navigate(item);
    });

    $("pathbar").appendChild(button);
  });

  document.querySelectorAll(".side-item").forEach(
    item=>item.classList.remove("active")
  );

  $("navSSD").classList.add("active");
}

/* CLIQUE EM ARQUIVOS */

$("files").addEventListener("click",async e=>{
  const element=e.target.closest(".file");
  if(!element) return;

  const items=searchText
    ?collectFiles(root,[]).filter(
      item=>item.name.toLowerCase().includes(searchText.toLowerCase())
    )
    :current.children;

  const item=items[Number(element.dataset.index)];

  if(!item) return;

  selected=item;

  if(item.type==="directory") {
    if(searchText) {
      searchText="";
      $("search").value="";
    }

    await navigate(item);
  } else {
    render();
    openFile(item);
  }
});

/* VISUALIZAR ARQUIVOS */

async function getFile(item) {
  if(item.file) return item.file;

  if(item.handle) return await item.handle.getFile();

  return null;
}

async function openFile(item) {
  const file=await getFile(item);

  if(!file) return;

  $("previewTitle").textContent=item.name;
  $("previewBody").innerHTML="";

  if(currentPreviewURL) {
    URL.revokeObjectURL(currentPreviewURL);
    currentPreviewURL=null;
  }

  const url=URL.createObjectURL(file);
  currentPreviewURL=url;

  const ext=item.name.split(".").pop().toLowerCase();

  if(file.type.startsWith("image/")) {
    const img=document.createElement("img");
    img.src=url;
    $("previewBody").appendChild(img);

  } else if(file.type==="application/pdf" || ext==="pdf") {
    const frame=document.createElement("iframe");
    frame.src=url;
    $("previewBody").appendChild(frame);

  } else if(
    file.type.startsWith("text/") ||
    ["txt","json","js","css","html","xml","log","md","csv","ini","bat","ps1","reg"].includes(ext)
  ) {
    const pre=document.createElement("pre");

    const text=await file.slice(0,1024*1024).text();
    pre.textContent=text;

    $("previewBody").appendChild(pre);

  } else if(file.type.startsWith("video/")) {
    const video=document.createElement("video");
    video.src=url;
    video.controls=true;
    video.style.maxWidth="100%";
    video.style.maxHeight="55dvh";
    $("previewBody").appendChild(video);

  } else if(file.type.startsWith("audio/")) {
    const audio=document.createElement("audio");
    audio.src=url;
    audio.controls=true;
    $("previewBody").appendChild(audio);

  } else {
    $("previewBody").innerHTML=`
      <div style="font-size:50px">📄</div>
      <h3>Arquivo selecionado</h3>
      <p>${escapeHTML(item.name)}</p>
      <p>Tamanho: ${formatSize(file.size)}</p>
      <p>Este formato não possui visualizador integrado.</p>
    `;
  }

  $("overlay").classList.add("show");

  $("downloadBtn").onclick=()=>{
    const a=document.createElement("a");
    a.href=url;
    a.download=file.name;
    a.click();
  };
}

/* FECHAR VISUALIZADOR */

function closePreview() {
  $("overlay").classList.remove("show");

  if(currentPreviewURL) {
    URL.revokeObjectURL(currentPreviewURL);
    currentPreviewURL=null;
  }
}

$("closePreview").onclick=closePreview;
$("closePreview2").onclick=closePreview;

$("overlay").addEventListener("click",e=>{
  if(e.target===$("overlay")) closePreview();
});

/* BOTÕES */

$("connectBtn").onclick=connectSSD;
$("backBtn").onclick=goBack;

$("homeBtn").onclick=()=>{
  if(root) navigate(root);
  else showEmptyHome();
};

$("themeBtn").onclick=()=>{
  document.body.classList.toggle("dark");

  $("themeBtn").textContent=
    document.body.classList.contains("dark")?"☀️":"🌙";
};

$("viewBtn").onclick=()=>{
  listMode=!listMode;
  $("viewBtn").textContent=listMode?"▦ Ícones":"▤ Lista";
  render();
};

$("search").addEventListener("input",e=>{
  searchText=e.target.value;
  render();
});

$("aboutBtn").onclick=()=>{
  alert(
    "Windows SSD Explorer 0.1\n\n"+
    "Explorador de arquivos experimental.\n"+
    "Desenvolvido em HTML, CSS e JavaScript.\n\n"+
    "Acesso ao armazenamento limitado pelas permissões do navegador."
  );
};

/* NAVEGAÇÃO LATERAL */

function showEmptyHome() {
  current=null;
  $("folderTitle").textContent="Início";
  $("fileCount").textContent="0 itens";
  $("files").innerHTML="";
  $("files").classList.add("hidden");
  $("empty").classList.remove("hidden");
  $("emptyTitle").textContent="Bem-vindo ao SSD Explorer";
  $("emptyDescription").textContent=
    "Conecte seu SSD para visualizar seus arquivos.";
  $("pathbar").innerHTML="<span>⌂ Início</span>";
  $("navHome").classList.add("active");
}

$("navHome").onclick=()=>{
  if(root) navigate(root);
  else showEmptyHome();
};

$("navSSD").onclick=()=>{
  if(root) navigate(root);
  else connectSSD();
};

function findFolder(name) {
  if(!root) return;

  const target=collectFiles(root,[]).find(
    item=>item.type==="directory" &&
    item.name.toLowerCase()===name.toLowerCase()
  );

  if(target) navigate(target);
  else alert("Pasta não encontrada. Carregue o SSD primeiro.");
}

$("navDesktop").onclick=()=>findFolder("Desktop");
$("navDocuments").onclick=()=>findFolder("Documents");
$("navDownloads").onclick=()=>findFolder("Downloads");
$("navPictures").onclick=()=>findFolder("Pictures");

/* INICIALIZAÇÃO */

showEmptyHome();

</script>

</body>
