
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>Windows SSD Explorer</title>

<style>
:root {
  color-scheme:dark;
  --bg:#101827;
  --panel:#182438;
  --panel2:#202f45;
  --text:#f4f7fc;
  --muted:#9baac0;
  --border:#304057;
  --hover:#293c57;
  --accent:#438cf5;
}

body.light {
  color-scheme:light;
  --bg:#f1f4f9;
  --panel:#ffffff;
  --panel2:#e8edf5;
  --text:#202938;
  --muted:#758197;
  --border:#dce3ed;
  --hover:#e6efff;
  --accent:#1769d2;
}

* {box-sizing:border-box}

body {
  margin:0;
  height:100dvh;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:"Segoe UI",Arial,sans-serif;
}

button,input {font:inherit}
button {cursor:pointer;color:inherit}

#splash {
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:#101827;
  color:white;
  transition:opacity .5s;
}

.win-logo {
  width:76px;
  height:76px;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:5px;
  transform:perspective(200px) rotateY(-8deg);
  margin-bottom:28px;
}

.win-logo span {background:#1687ed}

#splash h2 {
  font-size:20px;
  font-weight:400;
  margin:0 0 8px;
}

#splash p {font-size:12px;color:#9baac0}

.loader {
  width:145px;
  height:3px;
  background:#26344b;
  margin-top:28px;
  overflow:hidden;
  border-radius:5px;
}

.loader:after {
  content:"";
  display:block;
  height:100%;
  width:40%;
  background:#3997ff;
  animation:loading 1.2s infinite ease-in-out;
}

@keyframes loading {
  from {transform:translateX(-100%)}
  to {transform:translateX(350%)}
}

#app {
  height:100dvh;
  display:flex;
  flex-direction:column;
  opacity:0;
  transition:opacity .5s;
}

#app.ready {opacity:1}

.top {
  height:58px;
  flex-shrink:0;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
}

.brand {
  display:flex;
  align-items:center;
  gap:11px;
  font-size:16px;
  font-weight:600;
}

.small-logo {
  width:27px;
  height:27px;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:2px;
}

.small-logo span {background:#2589ef}

.top-actions {display:flex;gap:8px}

.btn {
  border:1px solid var(--border);
  background:var(--panel2);
  border-radius:7px;
  padding:9px 12px;
  font-size:13px;
}

.btn:hover {background:var(--hover)}

.blue {
  background:var(--accent);
  color:white;
  border-color:var(--accent);
}

.blue:hover {opacity:.85}

.toolbar {
  background:var(--panel);
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 14px;
  border-bottom:1px solid var(--border);
}

.search {
  flex:1;
  min-width:50px;
  border:1px solid var(--border);
  border-radius:7px;
  background:var(--bg);
  color:var(--text);
  padding:10px;
  outline:none;
}

.search:focus {border-color:var(--accent)}

.main {
  flex:1;
  min-height:0;
  display:flex;
}

.sidebar {
  width:215px;
  flex-shrink:0;
  background:var(--panel);
  border-right:1px solid var(--border);
  padding:13px 9px;
  overflow:auto;
}

.section {
  padding:13px 10px 8px;
  color:var(--muted);
  font-size:11px;
  font-weight:bold;
  text-transform:uppercase;
  letter-spacing:1px;
}

.nav {
  width:100%;
  padding:11px;
  border:0;
  border-radius:6px;
  background:transparent;
  display:flex;
  align-items:center;
  gap:12px;
  text-align:left;
  font-size:13px;
}

.nav:hover,.nav.active {background:var(--hover)}

.nav-icon {font-size:18px}

.content {
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.address {
  display:flex;
  align-items:center;
  gap:7px;
  min-height:48px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  padding:8px 15px;
  overflow:auto;
  white-space:nowrap;
  font-size:13px;
}

.crumb {
  border:0;
  background:transparent;
  color:var(--text);
  padding:6px;
  border-radius:5px;
}

.crumb:hover {background:var(--hover)}

.heading {
  padding:17px 19px 10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.heading h2 {
  font-size:20px;
  font-weight:500;
  margin:0;
}

.muted {color:var(--muted);font-size:12px}

.file-area {
  flex:1;
  overflow:auto;
  padding:12px 17px 25px;
}

.file-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(105px,1fr));
  gap:8px;
}

.file {
  min-width:0;
  padding:13px 5px;
  border:1px solid transparent;
  border-radius:8px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:8px;
  cursor:pointer;
}

.file:hover,.file.selected {
  background:var(--hover);
  border-color:var(--border);
}

.file-icon {font-size:39px}

.file-name {
  width:100%;
  font-size:12px;
  overflow-wrap:anywhere;
}

.file-detail {font-size:10px;color:var(--muted)}

.empty {
  text-align:center;
  padding:65px 15px;
  color:var(--muted);
}

.empty .big {font-size:60px;margin-bottom:15px}

.empty h3 {color:var(--text);font-weight:500}

.empty p {font-size:13px;line-height:1.7}

.status {
  min-height:32px;
  flex-shrink:0;
  background:var(--panel);
  border-top:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:5px 13px;
  font-size:11px;
  color:var(--muted);
}

.overlay {
  position:fixed;
  z-index:20;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:#000b;
  padding:12px;
}

.overlay.show {display:flex}

.modal {
  width:min(750px,100%);
  max-height:90dvh;
  overflow:auto;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
}

.modal-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px;
  border-bottom:1px solid var(--border);
}

.modal-body {
  padding:15px;
  text-align:center;
}

.modal-body img {
  max-width:100%;
  max-height:60dvh;
  object-fit:contain;
}

.modal-body iframe {
  width:100%;
  height:60dvh;
  border:0;
}

.modal-body pre {
  text-align:left;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  overflow:auto;
  max-height:60dvh;
  padding:12px;
  background:var(--bg);
  border-radius:7px;
}

.modal-foot {
  padding:12px;
  display:flex;
  justify-content:flex-end;
  gap:8px;
  border-top:1px solid var(--border);
}

.hidden {display:none!important}

@media(max-width:650px) {
  .sidebar {width:60px;padding:10px 4px}
  .section,.nav-label {display:none}
  .nav {justify-content:center;padding:13px 3px}
  .nav-icon {font-size:21px}
  .brand {font-size:13px}
  .toolbar {flex-wrap:wrap;padding:8px}
  .toolbar .btn {padding:9px;font-size:11px}
  .search {order:5;flex-basis:100%}
  .file-grid {grid-template-columns:repeat(auto-fill,minmax(83px,1fr))}
  .heading {padding:14px}
}
</style>
</head>

<body>

<div id="splash">
  <div class="win-logo">
    <span></span><span></span>
    <span></span><span></span>
  </div>
  <h2>Windows SSD Explorer</h2>
  <p>Explorador de arquivos</p>
  <div class="loader"></div>
</div>

<div id="app">

  <header class="top">
    <div class="brand">
      <div class="small-logo">
        <span></span><span></span>
        <span></span><span></span>
      </div>
      Windows SSD Explorer
    </div>

    <div class="top-actions">
      <button class="btn" id="theme">☀️</button>
      <button class="btn" id="info">ⓘ</button>
    </div>
  </header>

  <div class="toolbar">
    <button class="btn blue" id="openSSD">💽 Abrir SSD</button>
    <button class="btn" id="openFolder">📁 Pasta</button>
    <button class="btn" id="back">←</button>
    <button class="btn" id="home">⌂</button>
    <input class="search" id="search" placeholder="Pesquisar neste SSD...">
  </div>

  <div class="main">

    <aside class="sidebar">
      <div class="section">Início</div>

      <button class="nav active" id="nHome">
        <span class="nav-icon">⌂</span>
        <span class="nav-label">Início</span>
      </button>

      <button class="nav" id="nDesktop">
        <span class="nav-icon">🖥️</span>
        <span class="nav-label">Área de trabalho</span>
      </button>

      <button class="nav" id="nDocs">
        <span class="nav-icon">📄</span>
        <span class="nav-label">Documentos</span>
      </button>

      <button class="nav" id="nDownloads">
        <span class="nav-icon">⬇️</span>
        <span class="nav-label">Downloads</span>
      </button>

      <button class="nav" id="nPictures">
        <span class="nav-icon">🖼️</span>
        <span class="nav-label">Imagens</span>
      </button>

      <div class="section">Dispositivos</div>

      <button class="nav" id="nSSD">
        <span class="nav-icon">💽</span>
        <span class="nav-label">SSD externo</span>
      </button>
    </aside>

    <section class="content">

      <div class="address" id="address">
        <span>⌂ Início</span>
      </div>

      <div class="heading">
        <h2 id="title">Início</h2>
        <span class="muted" id="count">0 itens</span>
      </div>

      <div class="file-area">
        <div class="file-grid" id="grid"></div>

        <div class="empty" id="empty">
          <div class="big">💽</div>
          <h3>Seu armazenamento</h3>
          <p>
            Conecte o SSD ao iPhone pelo adaptador USB.<br>
            Depois toque em Abrir SSD e escolha os arquivos
            no aplicativo Arquivos.
          </p>
          <button class="btn blue" id="emptyConnect">
            Selecionar arquivos do SSD
          </button>
        </div>
      </div>

    </section>
  </div>

  <footer class="status">
    <span id="status">Aguardando armazenamento</span>
    <span>Explorer 0.2</span>
  </footer>
</div>

<!-- SELETORES NATIVOS -->

<input id="filePicker" type="file" multiple class="hidden">
<input id="folderPicker" type="file" multiple webkitdirectory class="hidden">

<!-- VISUALIZADOR -->

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <strong id="previewTitle">Arquivo</strong>
      <button class="btn" id="close">✕</button>
    </div>

    <div class="modal-body" id="preview"></div>

    <div class="modal-foot">
      <button class="btn blue" id="save">Salvar no celular</button>
      <button class="btn" id="close2">Fechar</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

let root = null;
let current = null;
let history = [];
let currentURL = null;
let search = "";
let filesLoaded = 0;

function makeFolder(name,parent=null) {
  return {
    name,
    type:"folder",
    parent,
    children:[],
    path:parent ? [...parent.path,name] : [name]
  };
}

function makeFile(file,parent) {
  return {
    name:file.name,
    type:"file",
    file,
    parent,
    path:[...parent.path,file.name]
  };
}

function safe(value) {
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  })[c]);
}

/* INICIALIZAÇÃO */

window.addEventListener("load",()=>{
  setTimeout(()=>{
    $("splash").style.opacity="0";
    $("app").classList.add("ready");

    setTimeout(()=>{
      $("splash").style.display="none";
    },500);
  },1300);
});

/* TEMA */

$("theme").onclick=()=>{
  document.body.classList.toggle("light");

  $("theme").textContent=
    document.body.classList.contains("light")?"🌙":"☀️";
};

/* CONEXÃO */

function connectSSD() {
  // iPhone e iPad: abrir seletor nativo de arquivos.
  // O utilizador navega até o SSD no app Arquivos.

  $("filePicker").click();
}

$("openSSD").onclick=connectSSD;
$("emptyConnect").onclick=connectSSD;

/* SELECIONAR PASTA */

$("openFolder").onclick=()=>{
  $("folderPicker").click();
};

/* CONSTRUIR ÁRVORE */

function importFiles(fileList) {
  const files=Array.from(fileList);

  if(!files.length) return;

  const firstPath=files[0].webkitRelativePath || "";

  const folderName=firstPath
    ? firstPath.split("/")[0]
    : "SSD selecionado";

  root=makeFolder(folderName);

  for(const file of files) {
    const relative=file.webkitRelativePath;

    if(relative) {
      const parts=relative.split("/");
      let node=root;

      for(let i=1;i<parts.length-1;i++) {
        let child=node.children.find(
          x=>x.type==="folder" && x.name===parts[i]
        );

        if(!child) {
          child=makeFolder(parts[i],node);
          node.children.push(child);
        }

        node=child;
      }

      node.children.push(makeFile(file,node));

    } else {
      root.children.push(makeFile(file,root));
    }
  }

  sortTree(root);

  current=root;
  history=[];
  search="";
  $("search").value="";

  filesLoaded=files.length;

  $("status").textContent=
    filesLoaded+" arquivos carregados";

  $("nSSD").classList.add("active");

  render();
}

function sortTree(node) {
  node.children.sort((a,b)=>{
    if(a.type!==b.type) return a.type==="folder"?-1:1;
    return a.name.localeCompare(b.name);
  });

  node.children.forEach(child=>{
    if(child.type==="folder") sortTree(child);
  });
}

$("filePicker").onchange=e=>{
  importFiles(e.target.files);
  e.target.value="";
};

$("folderPicker").onchange=e=>{
  importFiles(e.target.files);
  e.target.value="";
};

/* NAVEGAÇÃO */

function go(node) {
  if(!node || node.type!=="folder") return;

  if(current && current!==node) history.push(current);

  current=node;
  render();
}

function back() {
  if(history.length) {
    current=history.pop();
    render();
  } else if(current && current.parent) {
    current=current.parent;
    render();
  }
}

$("back").onclick=back;

$("home").onclick=()=>{
  if(root) {
    history=[];
    go(root);
  } else {
    showHome();
  }
};

$("nHome").onclick=showHome;

$("nSSD").onclick=()=>{
  if(root) {
    history=[];
    go(root);
  } else connectSSD();
};

/* PESQUISA */

function flatten(node,result=[]) {
  for(const child of node.children) {
    result.push(child);

    if(child.type==="folder") flatten(child,result);
  }

  return result;
}

$("search").addEventListener("input",e=>{
  search=e.target.value.toLowerCase().trim();
  render();
});

/* ÍCONES */

function icon(item) {
  if(item.type==="folder") return "📁";

  const ext=item.name.split(".").pop().toLowerCase();

  const map={
    jpg:"🖼️",jpeg:"🖼️",png:"🖼️",webp:"🖼️",
    gif:"🖼️",bmp:"🖼️",
    pdf:"📕",
    doc:"📝",docx:"📝",
    xls:"📊",xlsx:"📊",
    mp4:"🎬",mkv:"🎬",mov:"🎬",
    mp3:"🎵",wav:"🎵",
    zip:"📦",rar:"📦",7z:"📦",
    exe:"⚙️",dll:"⚙️",sys:"⚙️",
    txt:"📄",log:"📄",ini:"📄",
    html:"🌐",js:"📜",css:"🎨",
    iso:"💿"
  };

  return map[ext] || "📄";
}

/* TAMANHO */

function size(value) {
  if(value<1024) return value+" B";
  if(value<1048576) return (value/1024).toFixed(1)+" KB";
  if(value<1073741824) return (value/1048576).toFixed(1)+" MB";
  return (value/1073741824).toFixed(2)+" GB";
}

/* RENDERIZAR */

function render() {
  if(!current) return;

  $("title").textContent=current.name;

  let items=search
    ?flatten(root).filter(x=>x.name.toLowerCase().includes(search))
    :current.children;

  $("count").textContent=items.length+
    (items.length===1?" item":" itens");

  $("empty").classList.toggle("hidden",items.length>0);
  $("grid").classList.toggle("hidden",items.length===0);

  $("grid").innerHTML="";

  items.forEach(item=>{
    const div=document.createElement("div");
    div.className="file";

    const ic=document.createElement("div");
    ic.className="file-icon";
    ic.textContent=icon(item);

    const name=document.createElement("div");
    name.className="file-name";
    name.textContent=item.name;

    const detail=document.createElement("div");
    detail.className="file-detail";
    detail.textContent=item.type==="folder"
      ?"Pasta"
      :size(item.file.size);

    div.append(ic,name,detail);

    div.onclick=()=>{
      if(item.type==="folder") {
        if(search) {
          search="";
          $("search").value="";
        }
        go(item);
      } else {
        openFile(item);
      }
    };

    $("grid").appendChild(div);
  });

  /* CAMINHO */

  $("address").innerHTML="";

  let path=[];
  let n=current;

  while(n) {
    path.unshift(n);
    n=n.parent;
  }

  path.forEach((node,index)=>{
    if(index) {
      const sep=document.createElement("span");
      sep.textContent="›";
      $("address").appendChild(sep);
    }

    const btn=document.createElement("button");
    btn.className="crumb";
    btn.textContent=node.name;

    btn.onclick=()=>{
      history=[];
      go(node);
    };

    $("address").appendChild(btn);
  });
}

/* ABRIR ARQUIVO */

async function openFile(item) {
  const file=item.file;
  const ext=item.name.split(".").pop().toLowerCase();

  if(currentURL) URL.revokeObjectURL(currentURL);

  currentURL=URL.createObjectURL(file);

  $("previewTitle").textContent=item.name;
  $("preview").innerHTML="";

  const url=currentURL;

  if(file.type.startsWith("image/")) {
    const img=document.createElement("img");
    img.src=url;
    $("preview").appendChild(img);

  } else if(file.type==="application/pdf" || ext==="pdf") {
    const frame=document.createElement("iframe");
    frame.src=url;
    $("preview").appendChild(frame);

  } else if(file.type.startsWith("video/")) {
    const video=document.createElement("video");
    video.src=url;
    video.controls=true;
    video.style.maxWidth="100%";
    video.style.maxHeight="60dvh";
    $("preview").appendChild(video);

  } else if(file.type.startsWith("audio/")) {
    const audio=document.createElement("audio");
    audio.src=url;
    audio.controls=true;
    $("preview").appendChild(audio);

  } else if(
    file.type.startsWith("text/") ||
    ["txt","log","json","html","css","js","xml","md","csv","ini","bat","ps1","reg"].includes(ext)
  ) {
    const pre=document.createElement("pre");
    pre.textContent=await file.slice(0,1024*1024).text();
    $("preview").appendChild(pre);

  } else {
    $("preview").innerHTML=`
      <div style="font-size:55px">📄</div>
      <h3>Arquivo selecionado</h3>
      <p>${safe(item.name)}</p>
      <p class="muted">${size(file.size)}</p>
      <p class="muted">Não há visualizador disponível para este formato.</p>
    `;
  }

  $("overlay").classList.add("show");

  $("save").onclick=()=>{
    const a=document.createElement("a");
    a.href=url;
    a.download=file.name;
    a.click();
  };
}

/* FECHAR */

function closePreview() {
  $("overlay").classList.remove("show");
}

$("close").onclick=closePreview;
$("close2").onclick=closePreview;

$("overlay").onclick=e=>{
  if(e.target===$("overlay")) closePreview();
};

/* PASTAS DO WINDOWS */

function findFolder(name) {
  if(!root) {
    alert("Primeiro selecione arquivos ou uma pasta do SSD.");
    return;
  }

  const result=flatten(root).find(
    x=>x.type==="folder" &&
    x.name.toLowerCase()===name.toLowerCase()
  );

  if(result) {
    history=[];
    go(result);
  } else {
    alert("Pasta não encontrada nos arquivos importados.");
  }
}

$("nDesktop").onclick=()=>findFolder("Desktop");
$("nDocs").onclick=()=>findFolder("Documents");
$("nDownloads").onclick=()=>findFolder("Downloads");
$("nPictures").onclick=()=>findFolder("Pictures");

/* INÍCIO */

function showHome() {
  if(root) {
    history=[];
    go(root);
  } else {
    $("title").textContent="Início";
    $("count").textContent="Nenhum dispositivo";
    $("grid").innerHTML="";
    $("grid").classList.add("hidden");
    $("empty").classList.remove("hidden");
    $("address").textContent="⌂ Início";
    $("nHome").classList.add("active");
  }
}
